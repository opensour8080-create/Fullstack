<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <h2>User</h2>

   
<button id="logoutBtn">Выйти</button>

<script>
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/logout", {
      method: "POST",
      credentials: "include"
    });
    window.location.href = "/login";
  });
</script>
   

</body>
</html>
