services:
  db:
    image: postgres:17-alpine
    container_name: opensor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensor
      POSTGRES_PASSWORD: opensor
      POSTGRES_DB: opensor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/config/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensor -d opensor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
